module_name: DYP-L08 Ultrasonic Underwater Rangefinder
serial_config:
    - command: dyp_l08 start -d ${SERIAL_DEV} -R p:SENS_DYP_L08_R_0
      port_config_param:
        name: SENS_DYP_L08_CFG
        group: Sensors
        default: GPS2

parameters:
    - group: Sensors
      definitions:
        SENS_DYP_L08_R_0:
            description:
                short: DYP-L08 Rotation
                long: |
                    DYP-L08 sensor rotation as MAV_SENSOR_ORIENTATION enum

            type: enum
            values:
                25: ROTATION_DOWNWARD_FACING
                24: ROTATION_UPWARD_FACING
                4: ROTATION_BACKWARD_FACING
                0: ROTATION_FORWARD_FACING
                6: ROTATION_LEFT_FACING
                2: ROTATION_RIGHT_FACING
            reboot_required: true
            default: 25
